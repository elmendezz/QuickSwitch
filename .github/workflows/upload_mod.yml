name: Update Module Json

on:
  release:
    types: [published] # Se activa al publicar una nueva versión/tag

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag Info
        id: vars
        run: |
          # Extrae el nombre de la etiqueta (ej. v6.0)
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          # Define el link de descarga basado en el tag
          echo "zip_url=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/modulo-v6.zip" >> $GITHUB_OUTPUT

      - name: Update update.json
        run: |
          # Usamos 'jq' para editar el JSON de forma segura
          # El versionCode lo sacamos de la parte numérica del tag (ej. v6 -> 6)
          VERSION_CODE=$(echo "${{ github.ref_name }}" | sed 's/[^0-9]//g')
          
          jq --arg ver "${{ github.ref_name }}" \
             --arg code "$VERSION_CODE" \
             --arg url "${{ steps.vars.outputs.zip_url }}" \
             --arg change "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
             '.version = $ver | .versionCode = ($code | tonumber) | .zipUrl = $url | .changelog = $change' \
             update.json > temp.json && mv temp.json update.json

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add update.json
          git commit -m "Update update.json for release ${{ github.ref_name }}"
          git push
          