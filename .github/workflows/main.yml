name: Build and Release Android & Magisk

on:
  push:
    branches:
      - 'anyfix/master'
  workflow_dispatch:
    inputs:
      version_input:
        description: 'Versión (ej: 190 = 19.0 / 192 = 19.2)'
        required: true
        default: '190'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- 1. CÁLCULO DE VERSIÓN (ARITMÉTICA PURA) ---
      - name: 🧮 Calculate Version
        id: versioning
        run: |
          # 1. Obtener número crudo (Input o current.txt + 1)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            RAW="${{ inputs.version_input }}"
          else
            [ -f current.txt ] && CUR=$(cat current.txt) || CUR=100
            RAW=$((CUR + 1))
          fi

          # 2. Matemática segura (Ej: 192)
          # Mayor = 192 / 10 = 19
          MAJOR=$((RAW / 10))
          # Menor = 192 % 10 = 2
          MINOR=$((RAW % 10))
          
          FINAL_VER="v${MAJOR}.${MINOR}"
          
          echo "🔢 Code: $RAW"
          echo "🏷️ Name: $FINAL_VER"
          
          echo "new_ver=$FINAL_VER" >> $GITHUB_OUTPUT
          echo "new_code=$RAW" >> $GITHUB_OUTPUT

      # --- 2. SETUP JAVA & ANDROID ---
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: ⚙️ Setup Android SDK
        uses: android-actions/setup-android@v3

      # --- 3. BUILD (FIX: SED SEGURO) ---
      - name: 🔨 Build Release APK
        run: |
          VER_CODE="${{ steps.versioning.outputs.new_code }}"
          VER_NAME="${{ steps.versioning.outputs.new_ver }}"
          
          # SAFETY CHECK: Si las variables están vacías, fallar antes de romper el archivo
          if [ -z "$VER_CODE" ] || [ -z "$VER_NAME" ]; then
            echo "❌ Error: Variables de versión vacías."
            exit 1
          fi

          cd QuickSwitch-App
          chmod +x gradlew
          
          # Inyección precisa
          # Reemplaza 'versionCode = X' por 'versionCode = NUEVO'
          find . -name "build.gradle.kts" -exec sed -i "s/versionCode\s*=\s*[0-9]*/versionCode = $VER_CODE/" {} +
          # Reemplaza 'versionName = "X"' por 'versionName = "NUEVO"'
          find . -name "build.gradle.kts" -exec sed -i "s/versionName\s*=\s*\".*\"/versionName = \"$VER_NAME\"/" {} +
          
          echo "🚀 Building Release..."
          # Usamos tu comando de build original (sin inventos raros)
          ./gradlew assembleRelease --no-daemon --parallel --build-cache -x lint -x test

      # --- 4. FIRMAR APK ---
      - name: 🔐 Sign APK Manually
        id: sign_app
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
          
          BUILD_TOOLS_VER=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -r | head -n 1)
          TOOLS_PATH="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VER"
          
          # Buscamos el APK generado (puede variar si es unsigned o no)
          INPUT_APK=$(find QuickSwitch-App/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          if [ -z "$INPUT_APK" ]; then
             echo "❌ No se encontró el APK para firmar"
             exit 1
          fi
          
          ALIGNED="app-aligned.apk"
          FINAL_APK="QuickSwitch-${{ steps.versioning.outputs.new_ver }}.apk"

          "$TOOLS_PATH/zipalign" -v -p 4 "$INPUT_APK" "$ALIGNED"
          "$TOOLS_PATH/apksigner" sign --ks release.jks --ks-key-alias "${{ secrets.ALIAS }}" --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" --key-pass "pass:${{ secrets.KEY_PASSWORD }}" --v4-signing-enabled false --out "$FINAL_APK" "$ALIGNED"

          rm -f "$ALIGNED" "$INPUT_APK" release.jks
          echo "apk_path=$FINAL_APK" >> $GITHUB_OUTPUT

      # --- 5. ZIP & METADATA ---
      - name: 📦 Create Zip & Metadata
        id: create_zip
        run: |
          NEW_VER="${{ steps.versioning.outputs.new_ver }}"
          NEW_CODE="${{ steps.versioning.outputs.new_code }}"
          APK_PATH="${{ steps.sign_app.outputs.apk_path }}"
          
          # Copiar APK para el ZIP
          cp "$APK_PATH" ./QuickSwitch.apk
          
          # Changelog
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "## $NEW_VER" > new_entry.md
          echo "### 📋 Changelog" >> new_entry.md
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:"* %s (%h)" >> new_entry.md
          else
            git log --pretty=format:"* %s (%h)" $LAST_TAG..HEAD >> new_entry.md
          fi
          echo -e "\n\n---" >> new_entry.md
          
          # JSON Update
          ZIP_NAME="QuickSwitch-Fork.zip"
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/$NEW_VER/$ZIP_NAME"
          
          echo "{}" > update.json
          jq --null-input --arg ver "$NEW_VER" --arg code "$NEW_CODE" --arg url "$ZIP_URL" '{"version": $ver, "versionCode": ($code|tonumber), "zipUrl": $url}' > update.json
          
          # Guardar versión
          echo "$NEW_CODE" > current.txt
          sed -i "s/versionCode=.*/versionCode=$NEW_CODE/" module.prop
          sed -i "s/version=.*/version=$NEW_VER/" module.prop

          # Crear ZIP Limpio
          rm -f app-release-*.apk *.idsig
          
          zip -r "$ZIP_NAME" . \
            -x "*.git*" ".github/*" "*.md" "*.yml" "current.txt" "QuickSwitch-App/*" \
            -x "QuickSwitch-v*.apk" "new_entry.md" "temp.json" "*.jks"
            
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      # --- 6. GOFILE (RESILIENTE + TU FIX) ---
      - name: ☁️ Upload to GoFile
        id: gofile
        continue-on-error: true
        run: |
          echo "### ☁️ GoFile Mirrors" >> new_entry.md
          
          # Definir archivos
          FILE_APK="${{ steps.sign_app.outputs.apk_path }}"
          FILE_ZIP="${{ steps.create_zip.outputs.zip_name }}"
          
          # 1. Obtener Servidor (Tu código)
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          
          if [ -z "$SERVER" ] || [ "$SERVER" == "null" ]; then
             echo "⚠️ No se pudo conectar a GoFile. Saltando..."
             exit 0
          fi

          # Función upload
          upload_file() {
            local file=$1
            local resp=$(curl -s -F "file=@$file" "https://${SERVER}.gofile.io/contents/uploadfile")
            echo $resp | jq -r '.data.downloadPage'
          }

          # Subir
          echo "📤 Uploading APK..."
          LINK_APK=$(upload_file "$FILE_APK")
          if [ "$LINK_APK" != "null" ]; then
             echo "* **APK:** $LINK_APK" >> new_entry.md
          fi

          echo "📤 Uploading ZIP..."
          LINK_ZIP=$(upload_file "$FILE_ZIP")
          if [ "$LINK_ZIP" != "null" ]; then
             echo "* **ZIP:** $LINK_ZIP" >> new_entry.md
          fi

      # --- 7. COMMIT ---
      - name: 🤖 Commit Updates
        run: |
          git config --local user.email "bot@noreply.github.com"
          git config --local user.name "github-actions"
          git add module.prop update.json current.txt
          git commit -m "🤖 Update to ${{ steps.versioning.outputs.new_ver }}" || echo "No changes"
          git push origin HEAD:anyfix/master

      # --- 8. RELEASE ---
      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.versioning.outputs.new_ver }}
          name: QuickSwitch ${{ steps.versioning.outputs.new_ver }}
          body_path: new_entry.md
          files: |
            ${{ steps.create_zip.outputs.zip_name }}
            ${{ steps.sign_app.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
