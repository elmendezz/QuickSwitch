name: Build and Release Android & Magisk

on:
  push:
    branches:
      - 'anyfix/master'
  workflow_dispatch:
    inputs:
      version_input:
        description: 'Versión (ej: 190 = 19.0, 195 = 19.5)'
        required: true
        default: '190'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- 1. CÁLCULO DE VERSIÓN (Lógica 3 dígitos) ---
      - name: 🧮 Calculate Version
        id: versioning
        run: |
          # 1. Determinar el código base (Input manual o leer archivo)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            RAW_CODE="${{ inputs.version_input }}"
          else
            # Si es push, lee current.txt e incrementa 1 (ej 190 -> 191)
            [ -f current.txt ] && OLD=$(cat current.txt) || OLD=100
            RAW_CODE=$((OLD + 1))
          fi

          # 2. Lógica matemática: 190 -> 19.0
          # Todo menos el último dígito es la versión Mayor
          MAJOR="${RAW_CODE:0:${#RAW_CODE}-1}"
          # El último dígito es la versión Menor
          MINOR="${RAW_CODE: -1}"
          
          # Fallback por si acaso
          [ -z "$MAJOR" ] && MAJOR="1"
          
          FINAL_VER="v${MAJOR}.${MINOR}"
          
          echo "🔢 Input: $RAW_CODE"
          echo "🏷️ Version Name: $FINAL_VER"
          
          echo "new_ver=$FINAL_VER" >> $GITHUB_OUTPUT
          echo "new_code=$RAW_CODE" >> $GITHUB_OUTPUT

      # --- 2. SETUP JAVA & ANDROID ---
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: ⚙️ Setup Android SDK
        uses: android-actions/setup-android@v3

      # --- 3. BUILD (Con fallback) ---
      - name: 🔨 Build Release APK
        run: |
          VER_CODE="${{ steps.versioning.outputs.new_code }}"
          VER_NAME="${{ steps.versioning.outputs.new_ver }}"
          cd QuickSwitch-App
          
          # Inyectar versión en Gradle
          find . -name "build.gradle.kts" -exec sed -i "s/versionCode\s*=\s*[0-9]\+/versionCode = $VER_CODE/" {} +
          find . -name "build.gradle.kts" -exec sed -i "s/versionName\s*=\s*\".*\"/versionName = \"$VER_NAME\"/" {} +
          chmod +x gradlew
          
          echo "🚀 Building..."
          if ./gradlew assembleRelease --no-daemon --parallel --build-cache -x lint -x test; then
             echo "✅ Build OK"
          else
             echo "⚠️ Falló build rápido. Reintentando limpio..."
             ./gradlew clean assembleRelease --no-daemon --stacktrace
          fi

      # --- 4. FIRMAR APK ---
      - name: 🔐 Sign APK Manually
        id: sign_app
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
          
          # Encontrar build tools automáticamente
          BUILD_TOOLS_VER=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -r | head -n 1)
          TOOLS_PATH="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VER"
          
          INPUT_APK="QuickSwitch-App/app/build/outputs/apk/release/app-release-unsigned.apk"
          [ ! -f "$INPUT_APK" ] && INPUT_APK="QuickSwitch-App/app/build/outputs/apk/release/app-release.apk"
          
          ALIGNED="app-aligned.apk"
          FINAL_APK="QuickSwitch-${{ steps.versioning.outputs.new_ver }}.apk"

          "$TOOLS_PATH/zipalign" -v -p 4 "$INPUT_APK" "$ALIGNED"
          "$TOOLS_PATH/apksigner" sign --ks release.jks --ks-key-alias "${{ secrets.ALIAS }}" --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" --key-pass "pass:${{ secrets.KEY_PASSWORD }}" --v4-signing-enabled false --out "$FINAL_APK" "$ALIGNED"

          # Limpieza
          rm -f "$ALIGNED" "$INPUT_APK" release.jks
          
          echo "apk_path=$FINAL_APK" >> $GITHUB_OUTPUT

      # --- 5. PREPARAR ZIP (NOMBRE FIJO: QuickSwitch-Fork.zip) ---
      - name: 📦 Create Zip & Metadata
        run: |
          NEW_VER="${{ steps.versioning.outputs.new_ver }}"
          NEW_CODE="${{ steps.versioning.outputs.new_code }}"
          APK_PATH="${{ steps.sign_app.outputs.apk_path }}"
          
          # 1. Copiar APK dentro con nombre corto
          cp "$APK_PATH" ./QuickSwitch.apk
          
          # 2. Generar Changelog Detallado
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "## $NEW_VER" > new_entry.md
          echo "### 📋 Changelog" >> new_entry.md
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:"* %s (%h)" >> new_entry.md
          else
            git log --pretty=format:"* %s (%h)" $LAST_TAG..HEAD >> new_entry.md
          fi
          echo -e "\n\n---" >> new_entry.md
          
          # 3. Update JSON
          # Nota: Usamos el nombre fijo en el link del JSON también
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/$NEW_VER/QuickSwitch-Fork.zip"
          echo "{}" > update.json # Reset o leer existente
          jq --null-input --arg ver "$NEW_VER" --arg code "$NEW_CODE" --arg url "$ZIP_URL" '{"version": $ver, "versionCode": ($code|tonumber), "zipUrl": $url}' > update.json
          
          # 4. Update Current.txt & Module.prop
          echo "$NEW_CODE" > current.txt
          sed -i "s/versionCode=.*/versionCode=$NEW_CODE/" module.prop
          sed -i "s/version=.*/version=$NEW_VER/" module.prop

          # 5. Crear ZIP (Excluyendo basura)
          # Nombre FIJO solicitado: QuickSwitch-Fork.zip
          ZIP_NAME="QuickSwitch-Fork.zip"
          
          # Limpiar antes de comprimir
          rm -f app-release-*.apk *.idsig
          
          zip -r "$ZIP_NAME" . \
            -x "*.git*" ".github/*" "*.md" "*.yml" "current.txt" "QuickSwitch-App/*" \
            -x "QuickSwitch-v*.apk" "new_entry.md" "temp.json" "*.jks"
            
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      # --- 6. SUBIDA A GOFILE (RESILIENTE) ---
      - name: ☁️ Upload to GoFile
        id: gofile
        continue-on-error: true  # <--- ESTO EVITA QUE FALLE TODO SI GOFILE CAE
        run: |
          echo "### ☁️ GoFile Mirrors" >> new_entry.md
          
          FILE_APK="${{ steps.sign_app.outputs.apk_path }}"
          FILE_ZIP="${{ steps.create_zip_metadata.outputs.zip_name }}" # QuickSwitch-Fork.zip
          
          # Usamos QuickSwitch-Fork.zip directamente si no encuentra variable (fallback)
          [ ! -f "$FILE_ZIP" ] && FILE_ZIP="QuickSwitch-Fork.zip"

          # 1. Obtener Servidor (Tu código corregido)
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          
          if [ "$SERVER" == "null" ] || [ -z "$SERVER" ]; then
            echo "❌ No se pudo obtener servidor de GoFile."
            exit 1
          fi

          echo "🌐 Servidor asignado: $SERVER"

          # Función de subida
          upload_file() {
            local file=$1
            # Subida silenciosa (-s) para parsear limpio con jq
            local resp=$(curl -s -F "file=@$file" "https://${SERVER}.gofile.io/contents/uploadfile")
            echo $resp | jq -r '.data.downloadPage'
          }

          # Subir APK
          echo "📤 Subiendo APK ($FILE_APK)..."
          LINK_APK=$(upload_file "$FILE_APK")
          if [ "$LINK_APK" != "null" ]; then
             echo "* **APK:** $LINK_APK" >> new_entry.md
             echo "✅ APK Link: $LINK_APK"
          fi

          # Subir ZIP
          echo "📤 Subiendo ZIP ($FILE_ZIP)..."
          LINK_ZIP=$(upload_file "$FILE_ZIP")
          if [ "$LINK_ZIP" != "null" ]; then
             echo "* **ZIP:** $LINK_ZIP" >> new_entry.md
             echo "✅ ZIP Link: $LINK_ZIP"
          fi

      # --- 7. COMMIT & PUSH ---
      - name: 🤖 Commit Updates
        run: |
          git config --local user.email "bot@noreply.github.com"
          git config --local user.name "github-actions"
          git add module.prop update.json current.txt
          git commit -m "🤖 Update to ${{ steps.versioning.outputs.new_ver }}" || echo "No changes"
          git push origin HEAD:anyfix/master

      # --- 8. GITHUB RELEASE ---
      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.versioning.outputs.new_ver }}
          name: QuickSwitch ${{ steps.versioning.outputs.new_ver }}
          body_path: new_entry.md
          files: |
            QuickSwitch-Fork.zip
            ${{ steps.sign_app.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
