name: Build and Release Android & Magisk

on:
  push:
    branches:
      - 'anyfix/master'
    paths-ignore:
      - 'README.md'
      - 'changelog.md'
      - 'update.json'
      - 'module.prop'
      - 'current.txt' 

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 'anyfix/master'

      # --- 1. CÁLCULO DE VERSIÓN (En memoria) ---
      - name: 🧮 Calculate Next Version
        id: versioning
        run: |
          if [ -f current.txt ]; then
            OLD_CODE=$(cat current.txt | tr -dc '0-9')
          else
            OLD_CODE=$(grep 'versionCode=' module.prop | cut -d= -f2 || echo "0")
          fi
          
          if [ -z "$OLD_CODE" ] || [ "$OLD_CODE" -eq 0 ]; then OLD_CODE=1; fi
          
          NEW_CODE=$((OLD_CODE + 1))
          NEW_VER="v${NEW_CODE}.0"
          
          echo "🔹 Target Version: $NEW_VER ($NEW_CODE)"
          
          echo "new_ver=$NEW_VER" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT

      # --- 2. PREPARACIÓN JAVA ---
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # --- 3. COMPILACIÓN (MODO RELEASE) ---
      - name: 🔨 Build Release APK
        run: |
          VER_CODE="${{ steps.versioning.outputs.new_code }}"
          VER_NAME="${{ steps.versioning.outputs.new_ver }}"
          
          cd QuickSwitch-App
          # Inyectamos versión
          find . -name "build.gradle.kts" -exec sed -i "s/versionCode\s*=\s*[0-9]\+/versionCode = $VER_CODE/" {} +
          find . -name "build.gradle.kts" -exec sed -i "s/versionName\s*=\s*\".*\"/versionName = \"$VER_NAME\"/" {} +
          
          chmod +x gradlew
          # Usamos assembleRelease en lugar de assembleDebug
          ./gradlew assembleRelease --no-daemon

      # --- 4. FIRMA DEL APK (LA SOLUCIÓN A TU PROBLEMA) ---
      - name: 🔐 Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: QuickSwitch-App/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        # Esta acción genera un output llamado 'signedReleaseFile'

      # --- 5. PROCESAR ARCHIVOS (Usando el APK Firmado) ---
      - name: 📦 Process Artifacts
        run: |
          # Obtenemos la ruta del APK YA FIRMADO desde el paso anterior
          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          
          echo "Processing Signed APK: $SIGNED_APK"
          
          # 1. Copia renombrada para el Release (fuera del zip)
          cp "$SIGNED_APK" "./QuickSwitch-${{ steps.versioning.outputs.new_ver }}.apk"
          
          # 2. Copia fija para dentro del ZIP (nombre genérico)
          cp "$SIGNED_APK" ./QuickSwitch.apk

      # --- 6. GUARDAR VERSIÓN (Solo si firma y build tuvieron éxito) ---
      - name: 📝 Update Version Files
        run: |
          NEW_CODE="${{ steps.versioning.outputs.new_code }}"
          NEW_VER="${{ steps.versioning.outputs.new_ver }}"
          
          echo "$NEW_CODE" > current.txt
          
          sed -i "s/versionCode=.*/versionCode=$NEW_CODE/" module.prop
          sed -i "s/version=.*/version=$NEW_VER/" module.prop

      # --- 7. CHANGELOG (Solo Inglés, Sin 'Current') ---
      - name: 📄 Generate Changelog
        run: |
          NEW_VER="${{ steps.versioning.outputs.new_ver }}"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          DIFF_STAT=$(git diff-tree --no-commit-id --stat -r HEAD)
          
          # Cabecera limpia
          echo "## $NEW_VER" > new_entry.md
          echo "**Changes:**" >> new_entry.md
          echo "$COMMIT_MSG" >> new_entry.md
          echo "" >> new_entry.md
          echo "**File Stats:**" >> new_entry.md
          echo "\`\`\`diff" >> new_entry.md
          echo "$DIFF_STAT" >> new_entry.md
          echo "\`\`\`" >> new_entry.md
          echo "" >> new_entry.md
          echo "---" >> new_entry.md
          
          # Concatenar historial
          if [ -f changelog.md ]; then
            cat new_entry.md changelog.md > temp_changelog.md
            mv temp_changelog.md changelog.md
          else
            cp new_entry.md changelog.md
          fi

      # --- 8. UPDATE.JSON ---
      - name: 🔄 Update update.json
        run: |
          NEW_VER="${{ steps.versioning.outputs.new_ver }}"
          NEW_CODE="${{ steps.versioning.outputs.new_code }}"
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/$NEW_VER/QuickSwitch-$NEW_VER.zip"
          CHANGELOG_URL="https://raw.githubusercontent.com/${{ github.repository }}/anyfix/master/changelog.md"
          
          if [ ! -s update.json ]; then echo "{}" > update.json; fi

          jq --arg ver "$NEW_VER" \
             --arg code "$NEW_CODE" \
             --arg url "$ZIP_URL" \
             --arg log "$CHANGELOG_URL" \
             '.version = $ver | .versionCode = ($code | tonumber) | .zipUrl = $url | .changelog = $log' \
             update.json > temp.json && mv temp.json update.json

      # --- 9. CREAR ZIP ---
      - name: 🤐 Create Magisk ZIP
        run: |
          zip -r "QuickSwitch-${{ steps.versioning.outputs.new_ver }}.zip" . \
            -x "*.git*" ".github/*" "*.md" "*.yml" "*.yaml" "update.json" "current.txt" "QuickSwitch-App/*" \
            -x "QuickSwitch-*.apk" "new_entry.md" "temp.json"

      # --- 10. COMMIT & PUSH ---
      - name: 🤖 Commit Bump
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add module.prop update.json changelog.md current.txt
          git add QuickSwitch-App/**/build.gradle.kts
          
          git commit -m "🤖 Bump version to ${{ steps.versioning.outputs.new_ver }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:anyfix/master

      # --- 11. PUBLICAR RELEASE ---
      - name: 🚀 Publish Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.versioning.outputs.new_ver }}
          name: QuickSwitch ${{ steps.versioning.outputs.new_ver }}
          body_path: new_entry.md
          files: |
            QuickSwitch-${{ steps.versioning.outputs.new_ver }}.zip
            QuickSwitch-${{ steps.versioning.outputs.new_ver }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
