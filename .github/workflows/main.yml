name: Auto Magisk Release (AnyFix)

on:
  push:
    branches:
      - 'anyfix/master'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 'anyfix/master'

      - name: Automatizar Versión y JSON
        id: versioning
        run: |
          # 1. Leer versionCode actual
          OLD_CODE=$(grep 'versionCode=' module.prop | cut -d= -f2)
          if [ -z "$OLD_CODE" ]; then OLD_CODE=1; fi
          
          # 2. Calcular nuevos valores
          NEW_CODE=$((OLD_CODE + 1))
          NEW_VER="v${NEW_CODE}.0"
          
          echo "Nueva versión detectada: $NEW_VER"
          
          # 3. Editar module.prop
          sed -i "s/versionCode=.*/versionCode=$NEW_CODE/" module.prop
          sed -i "s/version=.*/version=$NEW_VER/" module.prop
          
          # 4. Construir URL del release
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/$NEW_VER/QuickSwitch-$NEW_VER.zip"
          
          # 5. Crear update.json si no existe
          if [ ! -f update.json ]; then
            echo "{}" > update.json
          fi

          # 6. Actualizar JSON
          jq --arg ver "$NEW_VER" \
             --arg code "$NEW_CODE" \
             --arg url "$ZIP_URL" \
             '.version = $ver | .versionCode = ($code | tonumber) | .zipUrl = $url' \
             update.json > temp.json && mv temp.json update.json
          
          echo "new_ver=$NEW_VER" >> $GITHUB_OUTPUT

      - name: Crear ZIP del Módulo
        run: |
          zip -r "QuickSwitch-${{ steps.versioning.outputs.new_ver }}.zip" . \
            -x "*.git*" ".github/*" "*.md" "*.yml" "*.yaml" "update.json"

      - name: Guardar cambios (Commit & Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add module.prop update.json
          git commit -m "Auto-bump to ${{ steps.versioning.outputs.new_ver }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:anyfix/master

      - name: Publicar Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.versioning.outputs.new_ver }}
          name: QuickSwitch ${{ steps.versioning.outputs.new_ver }}
          body_path: changelog.md
          files: QuickSwitch-${{ steps.versioning.outputs.new_ver }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}