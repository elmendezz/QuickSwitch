name: Magisk Auto-Update V6

on:
  push:
    branches:
      - main  # O 'master', asegúrate de que sea el nombre de tu rama
    paths-ignore:
      - 'README.md'
      - 'changelog.md'
      - '.github/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version and Update Files
        id: bump
        run: |
          # Extraer versionCode actual del module.prop
          OLD_CODE=$(grep 'versionCode=' module.prop | cut -d= -f2)
          NEW_CODE=$((OLD_CODE + 1))
          NEW_VER="v${NEW_CODE}.0"
          
          # Actualizar module.prop
          sed -i "s/versionCode=.*/versionCode=$NEW_CODE/" module.prop
          sed -i "s/version=.*/version=$NEW_VER/" module.prop
          
          # Actualizar update.json
          # Cambia 'tu_usuario' y 'tu_repo' por los tuyos
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/$NEW_VER/modulo-$NEW_VER.zip"
          
          jq --arg ver "$NEW_VER" \
             --arg code "$NEW_CODE" \
             --arg url "$ZIP_URL" \
             '.version = $ver | .versionCode = ($code | tonumber) | .zipUrl = $url' \
             update.json > temp.json && mv temp.json update.json
          
          echo "new_tag=$NEW_VER" >> $GITHUB_OUTPUT

      - name: Zip Module
        run: |
          zip -r "modulo-${{ steps.bump.outputs.new_tag }}.zip" . -x "*.git*" ".github/*" "README.md"

      - name: Commit & Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add module.prop update.json
          git commit -m "Auto-bump to ${{ steps.bump.outputs.new_tag }} [skip ci]"
          git push

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          name: Release ${{ steps.bump.outputs.new_tag }}
          body_path: changelog.md
          files: "modulo-${{ steps.bump.outputs.new_tag }}.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
