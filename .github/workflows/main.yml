name: Build and Release Android & Magisk

on:
  push:
    branches:
      - 'anyfix/master'
    paths-ignore:
      - 'README.md'
      # Ignoramos estos para evitar loops, aunque [skip ci] es la clave
      - 'changelog.md'
      - 'update.json'
      - 'module.prop'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 'anyfix/master'

      # --- 1. LÓGICA DE VERSIONADO ---
      - name: Calcular Versión y Actualizar Props
        id: versioning
        run: |
          OLD_CODE=$(grep 'versionCode=' module.prop | cut -d= -f2)
          if [ -z "$OLD_CODE" ]; then OLD_CODE=1; fi
          
          NEW_CODE=$((OLD_CODE + 1))
          NEW_VER="v${NEW_CODE}.0"
          
          echo "Nueva versión: $NEW_VER ($NEW_CODE)"
          
          # Actualizar module.prop
          sed -i "s/versionCode=.*/versionCode=$NEW_CODE/" module.prop
          sed -i "s/version=.*/version=$NEW_VER/" module.prop
          
          echo "new_ver=$NEW_VER" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT

      # --- 2. CHANGELOG (MÁXIMO 2 ENTRADAS) ---
      - name: Generar Changelog (Limitado a 2 versiones)
        run: |
          NEW_VER="${{ steps.versioning.outputs.new_ver }}"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
          
          # 1. Crear la entrada NUEVA
          echo "## $NEW_VER" > new_entry.md
          echo "**Cambios:**" >> new_entry.md
          echo "$COMMIT_MSG" >> new_entry.md
          echo "" >> new_entry.md
          echo "**Archivos modificados:**" >> new_entry.md
          echo "\`\`\`" >> new_entry.md
          echo "$CHANGED_FILES" >> new_entry.md
          echo "\`\`\`" >> new_entry.md
          echo "" >> new_entry.md
          echo "---" >> new_entry.md
          
          # 2. Rescatar SOLO la última versión del changelog viejo (si existe)
          if [ -f changelog.md ] && [ -s changelog.md ]; then
            # Sed imprime desde el inicio hasta encontrar el primer separador "---" y se detiene (q).
            # Esto captura efectivamente solo la entrada más reciente anterior.
            sed '/^---$/q' changelog.md >> new_entry.md
          fi
          
          # 3. Reemplazar el archivo
          mv new_entry.md changelog.md

      # --- 3. ACTUALIZACIÓN UPDATE.JSON (MAGISK) ---
      - name: Actualizar update.json
        run: |
          NEW_VER="${{ steps.versioning.outputs.new_ver }}"
          NEW_CODE="${{ steps.versioning.outputs.new_code }}"
          # URL directa al zip que se subirá en el release
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/$NEW_VER/QuickSwitch-$NEW_VER.zip"
          
          # CORRECCIÓN: Si no existe O si está vacío (tu caso), iniciar con JSON vacío
          if [ ! -s update.json ]; then 
            echo "{}" > update.json
          fi

          # Actualizar campos para Magisk
          jq --arg ver "$NEW_VER" \
             --arg code "$NEW_CODE" \
             --arg url "$ZIP_URL" \
             '.version = $ver | .versionCode = ($code | tonumber) | .zipUrl = $url' \
             update.json > temp.json && mv temp.json update.json
             
          # Mostrar contenido para verificar en logs
          cat update.json

      # --- 4. BUILD ANDROID (KOTLIN DSL) ---
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Actualizar Versión en App Android
        run: |
          VER_CODE="${{ steps.versioning.outputs.new_code }}"
          VER_NAME="${{ steps.versioning.outputs.new_ver }}"
          
          cd QuickSwitch-App
          # Busca build.gradle.kts y reemplaza valores con sintaxis Kotlin
          find . -name "build.gradle.kts" -exec sed -i "s/versionCode\s*=\s*[0-9]\+/versionCode = $VER_CODE/" {} +
          find . -name "build.gradle.kts" -exec sed -i "s/versionName\s*=\s*\".*\"/versionName = \"$VER_NAME\"/" {} +

      - name: Compilar APK (Debug)
        run: |
          cd QuickSwitch-App
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: |
          find QuickSwitch-App -name "*-debug.apk" -exec mv {} QuickSwitch-App-${{ steps.versioning.outputs.new_ver }}.apk \;

      # --- 5. EMPAQUETADO ---
      - name: Crear ZIP del Módulo
        run: |
          zip -r "QuickSwitch-${{ steps.versioning.outputs.new_ver }}.zip" . \
            -x "*.git*" ".github/*" "*.md" "*.yml" "*.yaml" "update.json" "QuickSwitch-App/*" "*.apk"

      # --- 6. GUARDAR CAMBIOS (NO LOOP) ---
      - name: Guardar cambios en el Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add module.prop update.json changelog.md
          git add QuickSwitch-App/**/build.gradle.kts
          
          # [skip ci] evita el bucle infinito
          git commit -m "Auto-bump to ${{ steps.versioning.outputs.new_ver }} [skip ci]" || echo "No changes to commit"
          
          git push origin HEAD:anyfix/master

      # --- 7. PUBLICAR RELEASE ---
      - name: Publicar Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.versioning.outputs.new_ver }}
          name: QuickSwitch ${{ steps.versioning.outputs.new_ver }}
          body_path: changelog.md
          files: |
            QuickSwitch-${{ steps.versioning.outputs.new_ver }}.zip
            QuickSwitch-App-${{ steps.versioning.outputs.new_ver }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
