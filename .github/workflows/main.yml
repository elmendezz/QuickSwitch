name: Build and Release Android & Magisk

on:
  push:
    branches:
      - 'anyfix/master'
    paths-ignore:
      - 'README.md'
      - 'changelog.md'
      - 'update.json'
      - 'module.prop'
      - 'current.txt' 

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 'anyfix/master'

      # --- 1. CÁLCULO DE VERSIÓN (Solo memoria, no escribe archivos aún) ---
      - name: 🧮 Calcular Próxima Versión
        id: versioning
        run: |
          # Leemos sin modificar nada todavía
          if [ -f current.txt ]; then
            OLD_CODE=$(cat current.txt | tr -dc '0-9')
          else
            OLD_CODE=$(grep 'versionCode=' module.prop | cut -d= -f2 || echo "0")
          fi
          
          if [ -z "$OLD_CODE" ] || [ "$OLD_CODE" -eq 0 ]; then OLD_CODE=1; fi
          
          NEW_CODE=$((OLD_CODE + 1))
          NEW_VER="v${NEW_CODE}.0"
          
          echo "🔹 Versión calculada para este build: $NEW_VER ($NEW_CODE)"
          
          # Solo exportamos variables, NO escribimos en current.txt todavía
          echo "new_ver=$NEW_VER" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT

      # --- 2. CONFIGURACIÓN JAVA ---
      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # --- 3. APLICAR VERSIÓN A GRADLE Y COMPILAR ---
      - name: 🔨 Compilar APK (Prueba de Fuego)
        run: |
          VER_CODE="${{ steps.versioning.outputs.new_code }}"
          VER_NAME="${{ steps.versioning.outputs.new_ver }}"
          
          echo "Aplicando versión $VER_NAME al código fuente..."
          
          cd QuickSwitch-App
          # Modificamos gradle para compilar
          find . -name "build.gradle.kts" -exec sed -i "s/versionCode\s*=\s*[0-9]\+/versionCode = $VER_CODE/" {} +
          find . -name "build.gradle.kts" -exec sed -i "s/versionName\s*=\s*\".*\"/versionName = \"$VER_NAME\"/" {} +
          
          chmod +x gradlew
          
          # SI ESTO FALLA, EL SCRIPT SE DETIENE AQUÍ.
          # Como no hemos hecho commit ni updateado current.txt, la versión no se pierde.
          ./gradlew assembleDebug --no-daemon

      # --- 4. PREPARAR APKs (Si llegamos aquí, el build funcionó) ---
      - name: 📦 Procesar APKs
        run: |
          BUILT_APK=$(find QuickSwitch-App -name "*-debug.apk" | head -n 1)
          
          # 1. Copia renombrada para el Release
          cp "$BUILT_APK" "./QuickSwitch-${{ steps.versioning.outputs.new_ver }}.apk"
          
          # 2. Copia fija para dentro del ZIP
          cp "$BUILT_APK" ./QuickSwitch.apk

      # --- 5. ACTUALIZAR ARCHIVOS DE VERSIÓN (Ahora es seguro escribir) ---
      - name: 📝 Actualizar current.txt y module.prop
        run: |
          NEW_CODE="${{ steps.versioning.outputs.new_code }}"
          NEW_VER="${{ steps.versioning.outputs.new_ver }}"
          
          # Ahora sí guardamos la versión oficialmente
          echo "$NEW_CODE" > current.txt
          
          sed -i "s/versionCode=.*/versionCode=$NEW_CODE/" module.prop
          sed -i "s/version=.*/version=$NEW_VER/" module.prop

      # --- 6. CHANGELOG (Corregido error ENOENT) ---
      - name: 📄 Generar Changelog
        run: |
          NEW_VER="${{ steps.versioning.outputs.new_ver }}"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          AUTHOR_NAME=$(git log -1 --pretty=%an)
          DIFF_STAT=$(git diff-tree --no-commit-id --stat -r HEAD)
          
          # Crear el archivo temporal para esta release (new_entry.md)
          echo "## $NEW_VER (🔴 Current / Actual)" > new_entry.md
          echo "> **📅 Date:** $(date +'%Y-%m-%d') | **🤖 By:** $AUTHOR_NAME" >> new_entry.md
          echo "" >> new_entry.md
          echo "### 🇬🇧 English / 🇪🇸 Español Changes" >> new_entry.md
          echo "$COMMIT_MSG" >> new_entry.md
          echo "" >> new_entry.md
          echo "### 📊 File Stats (Diffs)" >> new_entry.md
          echo "\`\`\`diff" >> new_entry.md
          echo "$DIFF_STAT" >> new_entry.md
          echo "\`\`\`" >> new_entry.md
          echo "" >> new_entry.md
          echo "---" >> new_entry.md
          
          # CORRECCIÓN: Concatenar sin borrar new_entry.md
          if [ -f changelog.md ]; then
            cat new_entry.md changelog.md > temp_changelog.md
            mv temp_changelog.md changelog.md
          else
            cp new_entry.md changelog.md
          fi
          # IMPORTANTE: NO borramos new_entry.md, lo necesitamos para el release step

      # --- 7. UPDATE.JSON ---
      - name: 🔄 Actualizar update.json
        run: |
          NEW_VER="${{ steps.versioning.outputs.new_ver }}"
          NEW_CODE="${{ steps.versioning.outputs.new_code }}"
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/$NEW_VER/QuickSwitch-$NEW_VER.zip"
          CHANGELOG_URL="https://raw.githubusercontent.com/${{ github.repository }}/anyfix/master/changelog.md"
          
          if [ ! -s update.json ]; then echo "{}" > update.json; fi

          jq --arg ver "$NEW_VER" \
             --arg code "$NEW_CODE" \
             --arg url "$ZIP_URL" \
             --arg log "$CHANGELOG_URL" \
             '.version = $ver | .versionCode = ($code | tonumber) | .zipUrl = $url | .changelog = $log' \
             update.json > temp.json && mv temp.json update.json

      # --- 8. CREAR ZIP ---
      - name: 🤐 Crear ZIP Magisk
        run: |
          zip -r "QuickSwitch-${{ steps.versioning.outputs.new_ver }}.zip" . \
            -x "*.git*" ".github/*" "*.md" "*.yml" "*.yaml" "update.json" "current.txt" "QuickSwitch-App/*" \
            -x "QuickSwitch-*.apk" "new_entry.md" "temp.json"

      # --- 9. GUARDAR CAMBIOS (COMMIT) ---
      - name: 🤖 Commit y Push
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add module.prop update.json changelog.md current.txt
          git add QuickSwitch-App/**/build.gradle.kts
          
          git commit -m "🤖 Bump version to ${{ steps.versioning.outputs.new_ver }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:anyfix/master

      # --- 10. PUBLICAR RELEASE ---
      - name: 🚀 Publicar Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.versioning.outputs.new_ver }}
          name: QuickSwitch ${{ steps.versioning.outputs.new_ver }}
          body_path: new_entry.md  # Ahora sí encontrará este archivo
          files: |
            QuickSwitch-${{ steps.versioning.outputs.new_ver }}.zip
            QuickSwitch-${{ steps.versioning.outputs.new_ver }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
